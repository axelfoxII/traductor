<header>
  <nav>
    <ul>
      <li>{{ 'menu.home' | translate }}</li>
      
      <li>{{ 'menu.about' | translate }}</li>
      
      <li>{{ 'menu.contact' | translate }}</li> 
    
    </ul>
    <div class="language-switcher">
      <button (click)="switchLanguage('en')">
        <img src="https://flagcdn.com/w20/us.png" alt="English" />
      </button>
      <button (click)="switchLanguage('es')">
        <img src="https://flagcdn.com/w20/es.png" alt="Español" />
      </button>
    </div>
  </nav>
</header>

<main>
  <h1>{{ 'title' | translate }}</h1>   
  <h3>{{"greeting" | translate}}</h3> 

  <a class="btnEjemplo" (click)="mensaje()">{{"btn_message" | translate}}</a>
  
</main>
